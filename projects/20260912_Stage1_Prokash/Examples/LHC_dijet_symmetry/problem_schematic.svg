<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Helvetica, Arial, sans-serif">
  <style>
    .axis    { stroke: #333; stroke-width: 2; fill: none; }
    .beam    { stroke: #888; stroke-width: 3; stroke-dasharray: 7 4; fill: none; }
    .proton  { fill: #4a90e2; stroke: #1a4d8c; stroke-width: 2; }
    .vertex  { fill: #ffcc33; stroke: #b8860b; stroke-width: 2; }
    .jet1    { fill: #ee6655; stroke: #7a2222; stroke-width: 1.5; fill-opacity: 0.55; }
    .jet2    { fill: #55a868; stroke: #2a5234; stroke-width: 1.5; fill-opacity: 0.55; }
    .pT1     { stroke: #c0392b; stroke-width: 3.5; fill: none; }
    .pT2     { stroke: #2e7d32; stroke-width: 3.5; fill: none; }
    .pT1d    { stroke: #c0392b; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
    .pT2d    { stroke: #2e7d32; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
    .rot     { stroke: #555; stroke-width: 2; fill: none; }
    .lbl     { font-size: 16px; fill: #222; }
    .lbl-sm  { font-size: 13px; fill: #444; }
    .title   { font-size: 20px; font-weight: bold; fill: #111; }
    .ptitle  { font-size: 16px; font-weight: bold; fill: #333; }
    .math    { font-style: italic; font-size: 15px; fill: #222; }
    .red     { fill: #c0392b; }
    .grn     { fill: #2e7d32; }
  </style>

  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="ar-redt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="ar-grnt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="520" y="34" text-anchor="middle" class="title">
    LHC Dijet Rotational Symmetry — Problem Statement
  </text>

  <!-- ============================================================= -->
  <!--             Panel A : Lab frame (side view)                    -->
  <!-- ============================================================= -->
  <text x="250" y="74" text-anchor="middle" class="ptitle">(a) Lab frame</text>

  <!-- beam axis -->
  <line x1="40"  y1="290" x2="460" y2="290" class="beam"/>
  <text x="470"  y="295"  class="lbl-sm">beam axis (z)</text>

  <!-- proton 1 (left) and momentum arrow -->
  <line x1="48"  y1="290" x2="84"  y2="290"
        stroke="#1a4d8c" stroke-width="3" marker-end="url(#ar-grey)"/>
  <circle cx="100" cy="290" r="16" class="proton"/>
  <text   x="100" y="330" text-anchor="middle" class="lbl">p</text>

  <!-- proton 2 (right) and momentum arrow -->
  <line x1="452" y1="290" x2="416" y2="290"
        stroke="#1a4d8c" stroke-width="3" marker-end="url(#ar-grey)"/>
  <circle cx="400" cy="290" r="16" class="proton"/>
  <text   x="400" y="330" text-anchor="middle" class="lbl">p</text>

  <!-- collision vertex (starburst) -->
  <g transform="translate(250,290)">
    <polygon class="vertex"
      points="0,-22 5,-7 19,-12 9,0 19,12 5,7 0,22 -5,7 -19,12 -9,0 -19,-12 -5,-7"/>
  </g>

  <!-- jet 1 cone (up-right) -->
  <polygon points="250,290 410,150 430,180" class="jet1"/>
  <text   x="420" y="142" class="lbl red">jet 1</text>

  <!-- jet 2 cone (up-left) -->
  <polygon points="250,290 90,150 70,180" class="jet2"/>
  <text   x="44"  y="142" class="lbl grn">jet 2</text>

  <!-- reaction text -->
  <text x="250" y="400" text-anchor="middle" class="lbl">
    p + p  →  jet₁ + jet₂ + X
  </text>
  <text x="250" y="428" text-anchor="middle" class="lbl-sm">
    measured per jet:  (pₓ , p_y)  → input X = (p₁ₓ, p₁_y, p₂ₓ, p₂_y)
  </text>

  <!-- ============================================================= -->
  <!--         Panel B : Transverse plane (view along +z)             -->
  <!-- ============================================================= -->
  <text x="790" y="74" text-anchor="middle" class="ptitle">
    (b) Transverse plane (looking along +z)
  </text>

  <!-- axes -->
  <line x1="580" y1="290" x2="980" y2="290" class="axis" marker-end="url(#ar-grey)"/>
  <line x1="790" y1="450" x2="790" y2="110" class="axis" marker-end="url(#ar-grey)"/>
  <text x="990" y="307" class="lbl-sm">pₓ</text>
  <text x="800" y="108" class="lbl-sm">p_y</text>

  <!-- pT1 (solid red) at ~ +30° -->
  <line x1="790" y1="290" x2="910" y2="223" class="pT1" marker-end="url(#ar-red)"/>
  <text x="922" y="222" class="lbl red">p⃗_T,1</text>

  <!-- pT2 (solid green) approximately back-to-back -->
  <line x1="790" y1="290" x2="675" y2="354" class="pT2" marker-end="url(#ar-grn)"/>
  <text x="600" y="365" class="lbl grn">p⃗_T,2</text>

  <!-- rotated pT1 (dashed red) by +φ -->
  <line x1="790" y1="290" x2="852" y2="171" class="pT1d" marker-end="url(#ar-redt)"/>
  <text x="860" y="160" class="lbl-sm red">R(φ)·p⃗_T,1</text>

  <!-- rotated pT2 (dashed green) by +φ -->
  <line x1="790" y1="290" x2="725" y2="409" class="pT2d" marker-end="url(#ar-grnt)"/>
  <text x="700" y="430" class="lbl-sm grn">R(φ)·p⃗_T,2</text>

  <!-- rotation arc near pT1 head -->
  <path d="M 900 232 A 130 130 0 0 0 845 178" class="rot" marker-end="url(#ar-grey)"/>
  <text x="935" y="200" class="math">φ</text>

  <!-- formulas -->
  <text x="790" y="500" text-anchor="middle" class="math">
    SO(2):  (p⃗_T,1 , p⃗_T,2)  →  ( R(φ)·p⃗_T,1 , R(φ)·p⃗_T,2 )
  </text>
  <text x="790" y="528" text-anchor="middle" class="lbl">
    invariant:  m_jj,T = √( 2 · p_T,1 · p_T,2 · (1 − cos Δφ) )
  </text>

  <!-- ============================================================= -->
  <!--                    Footer (task statement)                     -->
  <!-- ============================================================= -->
  <text x="520" y="575" text-anchor="middle" class="lbl-sm" fill="#444">
    Stage1 task: from raw X alone, discover the 1-D latent z ≈ m_jj,T and
    recover the SO(2) generator
    A = diag(J, J),  J = (0 −1 ; 1 0).
  </text>
</svg>
